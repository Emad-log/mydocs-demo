<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyDocs (demo)</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f9;color:#1d2433}
header{background:#123c69;color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}.tag{background:#ffcb47;color:#333;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:8px}
main{max-width:1050px;margin:22px auto;padding:0 16px}.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 3px #0002;margin-bottom:16px}
button{background:#123c69;color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:14px}button.sec{background:#e6ebf2;color:#123c69}button.ok{background:#1f8a4c}button.bad{background:#c0392b}
input,select{padding:9px;border:1px solid #ccd3dd;border-radius:8px;font-size:14px;width:100%}label{font-size:13px;color:#556}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eef;text-align:left;font-size:14px}tr.click:hover{background:#f0f4fa;cursor:pointer}
.pill{font-size:12px;padding:3px 9px;border-radius:10px;display:inline-block}.Missing{background:#fdecea;color:#b03a2e}.Uploaded{background:#fff4d6;color:#8a6100}.Accepted{background:#e3f6ea;color:#1f8a4c}.Rejected{background:#fde2e2;color:#c0392b}
.bar{height:8px;background:#e6ebf2;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#1f8a4c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}.row{display:flex;gap:10px;align-items:center}.muted{color:#778;font-size:13px}
.notif{border-left:3px solid #123c69;padding:6px 10px;margin:6px 0;background:#f7f9fc;font-size:13px}.bell{position:relative;cursor:pointer}.bell span{position:absolute;top:-6px;right:-10px;background:#e74c3c;border-radius:9px;font-size:11px;padding:1px 6px}
.center{max-width:380px;margin:60px auto}h2{margin-top:0}.slot{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #e6ebf2;border-radius:10px;margin:8px 0}
</style></head><body>
<header><div><b>MyDocs</b><span class="tag">DEMO · fake data</span></div><div class="row" id="hdr"></div></header>
<main id="app"></main>
<script>
const DOCS=[["dl","Driver licence (front + back)",1],["aps","Purchase and sale agreement"],["mls","MLS listing"],["dep","Deposit receipt"],["depd","Copy of deposit draft"],["sav","Savings / RRSP / TFSA, 3-month statements",1],["t1","T1 General, last 2 years (PDF)",1],["noa","Notice of Assessment, last 2 years (CRA PDF)",1],["aoi","Articles of incorporation (if applicable)"],["t2","T2 General company, last 2 years (if applicable)"],["cnoa","Company Notice of Assessment, last 2 years (if applicable)"],["cbank","Company bank statements, 6 months (if applicable)"],["emp","Employment letter",1],["t4","T4, last 2 years",1],["pbank","Personal bank statements, last 3 months",1],["cr","Credit report",1],["ptax","Property tax (if applicable)"],["mstmt","Mortgage statement (if applicable)"],["contact","Contact information and email"],["cra","CRA tax payment receipts, last year"]];
const PRESETS={Purchase:["dl","aps","mls","dep","depd","sav","t1","noa","emp","t4","pbank","cr","contact"],Refinance:["dl","t1","noa","emp","t4","pbank","cr","ptax","mstmt","contact"],"Self-employed":["dl","aps","mls","dep","sav","t1","noa","aoi","t2","cnoa","cbank","pbank","cr","contact","cra"]};
let S=JSON.parse(localStorage.getItem("mp_demo")||"null")||seed();
function seed(){const mk=(name,email,apps,type,st)=>{const items=[];PRESETS[type].forEach(d=>{const per=DOCS.find(x=>x[0]==d)[2];(per?apps:[apps[0]]).forEach(a=>items.push({doc:d,who:per?a:null,status:"Missing",files:[]}))});st.forEach((s,i)=>{if(items[i]){items[i].status=s;if(s!="Missing")items[i].files=["scan_"+items[i].doc+".pdf"]}});return{id:Math.random().toString(36).slice(2,8),name,email,apps,type,items,created:"Oct 1"}};
return{auth:false,role:null,cur:null,notifs:[{t:"Priya Sharma uploaded T4, last 2 years",n:1},{t:"Daniel & Sofia Rossi uploaded Purchase and sale agreement",n:1}],clients:[mk("Daniel & Sofia Rossi","rossi.demo@example.com",["Daniel","Sofia"],"Purchase",["Accepted","Accepted","Uploaded","Accepted","Uploaded","Missing","Rejected"]),mk("Priya Sharma","priya.demo@example.com",["Priya"],"Self-employed",["Accepted","Uploaded","Uploaded","Uploaded","Missing","Uploaded","Uploaded","Uploaded","Missing"]),mk("Marcus Lee","marcus.demo@example.com",["Marcus"],"Refinance",[])]}}
const save=()=>localStorage.setItem("mp_demo",JSON.stringify(S));const $=id=>document.getElementById(id);const docName=d=>DOCS.find(x=>x[0]==d)[1];
const prog=c=>{const a=c.items.filter(i=>i.status=="Accepted").length,u=c.items.filter(i=>i.status!="Missing"&&i.status!="Rejected").length;return{a,u,t:c.items.length}};
const statusOf=c=>{const p=prog(c);return p.a==p.t?"Complete":p.u==p.t?"Ready for review":p.u?"In progress":"Not started"};
function hdr(){const unread=S.notifs.filter(n=>n.n).length;$("hdr").innerHTML=S.role=="broker"?`<span class="bell" onclick="viewNotifs()">🔔${unread?`<span>${unread}</span>`:""}</span><button class="sec" onclick="home()">Clients</button><button class="sec" onclick="logout()">Log out</button>`:S.role=="client"?`<button class="sec" onclick="logout()">Exit client view</button>`:"";}
function render(h){$("app").innerHTML=h;hdr();save()}
function logout(){S.role=null;S.auth=false;start()}
function start(){render(`<div class="card center"><h2>Broker sign in</h2><label>Email</label><input value="alghasemy@gmail.com"><br><br><button onclick="sent()">Email me a sign-in link</button><hr><p class="muted">Want to see the client side? Open a client, then use "Preview client portal".</p><button class="sec" onclick="if(confirm('Reset all demo data?')){localStorage.removeItem('mp_demo');location.reload()}">Reset demo data</button></div>`)}
function sent(){render(`<div class="card center"><h2>Check your email</h2><p class="muted">We sent a sign-in link. It works once and expires in 15 minutes. You'll stay signed in on this device for 30 days.</p><button onclick="S.role='broker';home()">(Demo) Open the link</button></div>`)}
function home(){S.role="broker";render(`<div class="card"><div class="row" style="justify-content:space-between"><h2>Clients</h2><button onclick="newClient()">+ New client</button></div><table><tr><th>Client</th><th>Type</th><th>Progress</th><th>Status</th></tr>${S.clients.map(c=>{const p=prog(c);return`<tr class="click" onclick="openClient('${c.id}')"><td><b>${c.name}</b><div class="muted">${c.email}</div></td><td>${c.type}</td><td style="width:200px"><div class="bar"><i style="width:${p.a/p.t*100}%"></i></div><span class="muted">${p.a} accepted · ${p.u} received · ${p.t} total</span></td><td>${statusOf(c)}</td></tr>`}).join("")}</table></div>`)}
function newClient(){render(`<div class="card"><h2>New client</h2><div class="grid"><div><label>Client name</label><input id="nm" placeholder="e.g. Alex Chen"></div><div><label>Email</label><input id="em" placeholder="alex@example.com"></div><div><label>Applicant names (comma separated, up to 3)</label><input id="ap" placeholder="Alex, Jordan"></div><div><label>Deal type (pre-ticks a checklist)</label><select id="ty" onchange="preset()">${Object.keys(PRESETS).map(k=>`<option>${k}</option>`)}</select></div></div><h3>Documents to request</h3><div class="grid" id="docs">${DOCS.map(d=>`<label><input type="checkbox" style="width:auto" value="${d[0]}"> ${d[1]}${d[2]?' <span class="muted">(per applicant)</span>':""}</label>`).join("")}</div><br><button onclick="createClient()">Create and send portal link</button> <button class="sec" onclick="home()">Cancel</button></div>`);preset()}
function preset(){const p=PRESETS[$("ty").value];document.querySelectorAll("#docs input").forEach(i=>i.checked=p.includes(i.value))}
function createClient(){const name=$("nm").value||"New Client",email=$("em").value||"client@example.com",apps=($("ap").value||name).split(",").map(s=>s.trim()).filter(Boolean).slice(0,3);const items=[];document.querySelectorAll("#docs input:checked").forEach(i=>{const per=DOCS.find(x=>x[0]==i.value)[2];(per?apps:[apps[0]]).forEach(a=>items.push({doc:i.value,who:per?a:null,status:"Missing",files:[]}))});const c={id:Math.random().toString(36).slice(2,8),name,email,apps,type:$("ty").value,items,created:"today"};S.clients.unshift(c);alert("Demo: a secure magic link would now be emailed to "+email+" (works once, expires in 15 min; they can request a new one anytime).");openClient(c.id)}
function openClient(id){S.cur=id;const c=S.clients.find(x=>x.id==id),p=prog(c);render(`<div class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${c.name}</h2><span class="muted">${c.email} · ${c.type} · ${statusOf(c)}</span></div><div class="row"><button class="sec" onclick="alert('Demo: reminder email sent to ${c.email}')">Send reminder</button><button class="sec" onclick="alert('Demo: zip of accepted files downloads via a 5-minute signed link')">Download all</button><button onclick="asClient('${c.id}')">Preview client portal</button></div></div><br><div class="bar"><i style="width:${p.a/p.t*100}%"></i></div></div><div class="card"><table><tr><th>Document</th><th>Applicant</th><th>Files</th><th>Status</th><th></th></tr>${c.items.map((it,i)=>`<tr><td>${docName(it.doc)}</td><td>${it.who||"-"}</td><td class="muted">${it.files.map(f=>`<a href="#" onclick="alert('Demo: opens via expiring signed link, and this view gets logged');return false">${f}</a>`).join("<br>")||"-"}</td><td><span class="pill ${it.status}">${it.status}</span>${it.reason?`<div class="muted">${it.reason}</div>`:""}</td><td>${it.status=="Uploaded"?`<button class="ok" onclick="setSt(${i},'Accepted')">Accept</button> <button class="bad" onclick="rej(${i})">Reject</button>`:""}</td></tr>`).join("")}</table></div><div class="card"><h3>If-applicable documents</h3><p class="muted">Turn on only what this client needs. Off items are hidden from the client.</p>${OPT.map(d=>{const on=c.items.some(i=>i.doc==d);return`<label style="display:block;margin:6px 0"><input type="checkbox" style="width:auto" ${on?"checked":""} onchange="tog('${d}',this.checked)"> ${docName(d)}</label>`}).join("")}</div><div class="card"><h3>Activity log</h3><p class="muted">Every upload, view, download and status change is recorded with time and IP (shown in the real build).</p></div>`)}
const OPT=['aoi','t2','cnoa','cbank','ptax','mstmt'];
function tog(d,on){const c=S.clients.find(x=>x.id==S.cur);if(on){if(!c.items.some(i=>i.doc==d))c.items.push({doc:d,who:null,status:'Missing',files:[]})}else c.items=c.items.filter(i=>i.doc!=d||i.files.length);openClient(S.cur)}
function setSt(i,s,r){const c=S.clients.find(x=>x.id==S.cur);c.items[i].status=s;c.items[i].reason=r||"";openClient(S.cur)}
function rej(i){const r=prompt("Reason for the client (e.g. 'blurry, please re-upload the back')");if(r!==null)setSt(i,"Rejected",r)}
function viewNotifs(){S.notifs.forEach(n=>n.n=0);render(`<div class="card"><h2>Notifications</h2><p class="muted">In the real build these also arrive by email.</p>${S.notifs.map(n=>`<div class="notif">${n.t}</div>`).join("")||"Nothing yet"}</div>`)}
function asClient(id){S.role="client";S.cur=id;const c=S.clients.find(x=>x.id==id),p=prog(c),left=c.items.filter(i=>i.status=="Missing"||i.status=="Rejected").length;render(`<div class="card"><h2>Hi ${c.apps[0]} 👋</h2><p>Your broker needs the documents below. Upload each one into its spot. Files go straight to your broker's secure, Canada-hosted storage.</p><div class="bar"><i style="width:${p.u/p.t*100}%"></i></div><p class="muted">${left?left+" item(s) still needed":"All done, thanks! Your broker will review."}</p></div><div class="card">${c.items.map((it,i)=>`<div class="slot"><div><b>${docName(it.doc)}</b>${it.who?` <span class="muted">for ${it.who}</span>`:""}<div class="muted">${it.files.join(", ")}${it.status=="Rejected"?` <span style="color:#c0392b">Needs a fix: ${it.reason||"please re-upload"}</span>`:""}</div></div><div class="row"><span class="pill ${it.status}">${it.status=="Uploaded"?"Received":it.status}</span>${it.status=="Missing"||it.status=="Rejected"?`<label><button onclick="this.nextElementSibling.click()">Upload</button><input type="file" style="display:none" accept=".pdf,.jpg,.jpeg,.png,.heic" multiple onchange="up(${i},this)"></label>`:""}</div></div>`).join("")}</div>`)}
function up(i,inp){const c=S.clients.find(x=>x.id==S.cur),it=c.items[i];const fs=[...inp.files];if(fs.some(f=>f.size>20e6))return alert("Max 20 MB per file");it.files=fs.map(f=>f.name);it.status="Uploaded";it.reason="";S.notifs.unshift({t:`${c.name} uploaded ${docName(it.doc)}${it.who?" ("+it.who+")":""}`,n:1});asClient(c.id)}
location.hash=="#broker"?home():location.hash=="#client"?asClient(S.clients[0].id):S.role=="broker"?home():start();
</script></body></html>
